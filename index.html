<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stormfront Arena</title>

  <link rel="stylesheet" href="styles.css" />

  <script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.164/build/three.module.js"
    }
  }
  </script>
</head>
<body>

<div id="hud">
  <div id="topBar">
    <div class="logo">STORMFRONT</div>
    <div id="players">Players: 25</div>
  </div>

  <div id="crosshair">
    <div class="h"></div>
    <div class="v"></div>
  </div>

  <div id="healthWrap">
    <div class="label">HP</div>
    <div id="healthBar">
      <div id="healthFill"></div>
    </div>
  </div>

  <div id="ammoBox">
    <div class="ammoIcon"></div>
    <div id="ammo">30 / 120</div>
  </div>

  <div id="minimap">
    <div class="ring"></div>
    <div class="playerDot"></div>
  </div>

  <div id="message">Click to Start</div>
</div>

<script type="module" src="game.js"></script>
</body>
</html>
